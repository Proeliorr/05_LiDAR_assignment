[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lidar-bridge"
version = "0.1.0"
description = "Orchestrator for the 3DFin -> (SmartQSM | arbor) -> reference-comparison LiDAR pipeline. Launches the stage containers through the mounted docker socket."
requires-python = ">=3.12"
dependencies = [
    "hydra-zen>=0.13",
    "hydra-core>=1.3.2",
    "laspy[lazrs]>=2.5",
    "numpy",
    "pandas",
    "openpyxl",
    "scipy",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lidar-bridge = "lidar_bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
