# Column mapping for the `compare` stage: where the plot reference measurements (the table passed as
# `reference=data/in/<file>.csv|xlsx`) keep the tree number, DBH and tree height.
#
# You usually do NOT need this file: without it the columns are auto-detected by title, case/accent-insensitively
# (tree number: tree, tree_id, id, nr, numer, "nr drzewa", lp ...; DBH: dbh, d13, d1.3, "DBH [cm]", pierśnica ...;
# height: h, th, height, wysokość, wys ...), the unit is read from the title ("DBH [cm]", "H (m)") or defaults to
# cm for DBH and m for height (a unit that comes from this DEFAULT is checked: a DBH median below 1 [metres?] or
# above 150 [millimetres?], or a height median above 120 [cm / mm?] stops the stage with an error that names the unit
# to set; state the unit in the title, here or with compare.dbh_unit=... and the check only warns), and csv
# delimiter / decimal comma / encoding are detected. If detection is ambiguous
# the stage stops and lists the columns it found; then copy this file to configs/reference_columns.yaml, adjust it
# and pass it with
#     compare.columns_file=configs/reference_columns.yaml
# Every key is optional (omit it or leave it empty for auto-detection). Precedence per setting:
# explicit stage parameter (compare.dbh_col=..., compare.dbh_unit=cm, compare.sheet=...) > this file > auto-detection.
#
# Rows are joined to the pipeline results on the TREE NUMBER ONLY (reference tree number == ordinal tree number
# 1..N == 3DFin row label T<k>); no coordinates or distances are involved. "T12", "12" and 12.0 are all tree 12.
# Duplicate tree numbers are an error. Units are converted to metres before comparing.

# xlsx only: sheet name or 0-based index (default: the first sheet)
sheet: 0
# row that holds the column titles, 0-based, counting only non-empty rows (csv and xlsx)
header_row: 0

# csv only (Polish Excel exports usually are ";" separated with a decimal comma)
csv:
  sep: ";"              # ";" | "," | "\t"   (omit: detected)
  decimal: ","          # "," | "."          (omit: decided per value, "12,5" and "12.5" both work)
  encoding: utf-8-sig   # utf-8-sig | cp1250 | utf-16  (omit: UTF-16 / UTF-8 detected, else Windows-1250)

tree_id:
  column: "Nr drzewa"   # exact column title in the table (case-insensitive match is accepted)

dbh:
  column: "DBH [cm]"    # diameter at breast height (1.3 m)
  unit: cm              # mm | cm | m   (omit or "auto": from the column title, else cm - and then a median < 1 or
                        #                > 150 is an error: probably m / mm, say so here or in the title)

height:
  column: "H [m]"       # total tree height
  unit: m               # mm | cm | m   (omit or "auto": from the column title, else m - and then a median > 120
                        #                is an error: probably cm / mm, say so here or in the title)
